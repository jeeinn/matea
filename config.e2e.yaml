# E2E config for phase2/hub-ecosystem local end-to-end verification.
# Credentials come from data/e2e-env.local via ${ENV} expansion.
# NOT for production; data/ is gitignored.

server:
  host: "127.0.0.1"
  port: 8080

gitea:
  url: "http://localhost:3000"
  admin_token: "${GITEA_ADMIN_TOKEN}"
  webhook_secret: "${GITEA_WEBHOOK_SECRET}"
  auto_provision: true

workspace:
  base_dir: "./data/work-e2e"

database:
  path: "./data/matea-e2e.db"

logging:
  level: "info"
  path: "./data/logs-e2e"

dispatcher:
  max_concurrent: 4
  queue_size: 100
  task_retry_count: 0
  rate_limit_backoff: 10
  agent_concurrency: parallel

llm:
  providers:
    sensenova:
      base_url: "https://token.sensenova.cn/v1"
      api_key: "${SENSENOVA_API_KEY}"
      type: "openai_compatible"
  defaults:
    provider: "sensenova"
    model: "deepseek-v4-flash"

agents:
  defaults:
    provider: "sensenova"
    model: "deepseek-v4-flash"
    max_output_tokens: 4096
    max_input_tokens: 64000
    temperature: 0.3
    timeout: "10m"
  loop:
    max_iterations: 8
    total_timeout: "15m"
    iteration_interval: 2
    no_progress_limit: 3
  backends:
    default: builtin
    backends:
      builtin:
        type: builtin
      opencode-local:
        type: hub-opencode
        base_url: "http://127.0.0.1:4096"
        timeout: "20m"
        workspace_mode: matea_path
        allow_fallback_builtin: false
      hermes-local:
        type: hub-hermes
        base_url: "http://127.0.0.1:9090"
        auth:
          username: hermes
          password: "hermes-e2e-token"
        timeout: "5m"

# deliver starts EMPTY on purpose: the E2E sets webhook_url via the config API
# at runtime to prove hot-reload (F-1) works without a restart.
deliver:
  webhook_url: ""
  timeout: "10s"
  max_retries: 1

debug:
  conversation_log:
    enabled: false

api:
  auth_token: "${API_AUTH_TOKEN}"

auth:
  jwt_secret: "e2e-jwt-secret-not-for-production-0123456789abcdef0123456789abcdef"
  default_admin_password: "admin123"
