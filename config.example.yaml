# Matea 最小示例：复制为 config.yaml 后修改；完整选项见 config.full-example.yaml
server:
  host: "0.0.0.0"
  port: 8080
database:
  path: "./data/matea.db"
# 可选：不配也能启动，但无法触发 Issue/PR 自动化
gitea:
  url: "http://localhost:3000"
  admin_token: "${GITEA_ADMIN_TOKEN}"
  webhook_secret: "your-webhook-secret-here"
# 可选：仅 builtin 时可不配；hub 后端在 Web UI「Hub 后端」配置
llm:
  providers: { deepseek: { base_url: "https://api.deepseek.com/v1", api_key: "${DEEPSEEK_API_KEY}", type: "openai_compatible" } }
  defaults: { provider: "deepseek", model: "deepseek-v4-flash" }
# 生产必须更换；首次登录后立即改默认管理员密码
auth:
  jwt_secret: "${JWT_SECRET:-change-me-in-production}"
  default_admin_password: "${ADMIN_PASSWORD:-admin123}"
