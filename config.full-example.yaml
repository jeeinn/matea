# Matea — 完整配置参考
# 日常上手请复制 config.example.yaml → config.yaml（精简可运行集）
# 本文件列出全部可选段与推荐取值；未写出的项由代码 applyDefaults 填充
# （例如 workspace.base_dir 默认为 ./data/work）
# 敏感项建议用环境变量：见 .env.example（复制为 .env，勿提交）
# config.yaml 已在 .gitignore，请勿提交含 Token 的配置

server:
  host: "0.0.0.0"
  port: 8080

gitea:
  # Gitea 服务地址
  url: "http://localhost:3000"
  # 管理员 API Token（用于自动注册 Agent 账号）
  # 在 Gitea → 个人设置 → 应用 → 生成令牌。Gitea ≥1.22 细粒度 scope 需逐项勾选：
  # read:user（验证身份）、write:repository（仓库/PR/部署密钥）、
  # write:issue（评论/标签）、write:admin（自动创建 Agent 账号，需站点管理员）
  admin_token: "${GITEA_ADMIN_TOKEN}"
  # Webhook 签名密钥（在 Gitea Webhook 设置中配置的密钥）
  webhook_secret: "your-webhook-secret-here"
  # 是否自动创建/续期 Agent 的 Gitea 账号与 Token（默认 true）。
  # 设为 false 时，Matea 不再调用 Gitea Admin API 建号/改密/签发令牌，
  # 由运维手动创建同名 Gitea 账号并填入 Agent 的 Gitea Token。
  # auto_provision: false

workspace:
  # Agent 工作目录根（Session 路径：{base_dir}/sessions/{id}/repo）
  # 省略时 applyDefaults 填充为 ./data/work
  base_dir: "./data/work"
  # 失败任务保留时间
  cleanup_after: "24h"
  # 最大磁盘占用
  max_disk_usage: "10GB"

dispatcher:
  # 最大并发 Agent 数
  max_concurrent: 2
  # 整任务失败后的重试次数（clone/runner 整次失败；不含 loop 内轮次）
  task_retry_count: 1
  # LLM 返回 429 时的退避等待（秒）；0 使用默认 60，负数表示关闭 429 重试
  rate_limit_backoff: 60
  # 同一 agent 跨 Issue 并发：parallel（默认）| serial_queue（同 agent 同时最多 1 个 running，其余入队等待）
  agent_concurrency: parallel
  # 任务队列大小
  queue_size: 100

database:
  # SQLite 数据库路径
  path: "./data/matea.db"

logging:
  # 日志级别: debug / info / warn / error
  # debug 时会记录所有 Gitea API 请求与响应摘要（敏感字段自动脱敏）
  level: "info"
  # 日志目录
  path: "./data/logs"

llm:
  # 仅用于 builtin 后端的 Agent。hub-* 后端（如 hub-opencode）由 Hub 自行管理 LLM，不读取此处。
  providers:
    # DeepSeek（推荐，性价比高）
    # models 未设置 → 使用内置模型目录
    deepseek:
      base_url: "https://api.deepseek.com/v1"
      api_key: "${DEEPSEEK_API_KEY}"
      type: "openai_compatible"
      default_params:
        temperature: 0.7

    # OpenAI — models: [] → 启用动态发现（调用 /models API）
    # openai:
    #   base_url: "https://api.openai.com/v1"
    #   api_key: "${OPENAI_API_KEY}"
    #   type: "openai_compatible"
    #   models: []

    # Claude（Anthropic）— 无公开 /models，始终使用内置目录
    # claude:
    #   api_key: "${ANTHROPIC_API_KEY}"
    #   type: "anthropic"

    # 本地 Ollama — models: [] → 调用 /api/tags 动态发现
    # ollama:
    #   base_url: "http://localhost:11434/v1"
    #   api_key: "ollama"
    #   models: []

  defaults:
    provider: "deepseek"
    model: "deepseek-v4-flash"

  # 单次 ChatCompletion 遇 HTTP 429 后的重试次数（需 rate_limit_backoff > 0；0 使用默认 10，负数表示不重试）
  rate_limit_retries: 10

# 调试选项（默认关闭）
debug:
  conversation_log:
    enabled: false
    max_content_chars: 100000   # 单条 message 写入前截断；0 = 不截断

# API 管理接口配置
api:
  # 管理 API 认证 Token（留空则不认证）
  # 调用 API 时需要在 Header 中添加: Authorization: Bearer <token>
  auth_token: "${API_AUTH_TOKEN}"

# Web UI / JWT 认证
# 安全：生产环境必须更换 jwt_secret；首次登录后立即修改默认管理员密码
auth:
  jwt_secret: "${JWT_SECRET:-change-me-in-production}"
  jwt_expiration: "24h"
  # 仅首次创建 admin 用户时生效
  default_admin_password: "${ADMIN_PASSWORD:-admin123}"

# Agent 模板配置
agents:
  defaults:
    provider: "deepseek"
    model: "deepseek-v4-flash"
    max_output_tokens: 8192
    max_input_tokens: 115200  # ~128K 上下文的 90%，主流模型安全兜底
    temperature: 0.3
    timeout: "5m"           # 单次任务（analyze/review/reply）总超时

  loop:
    max_iterations: 10
    total_timeout: "30m"    # 仅多轮任务（solve/fix_bug）总超时
    iteration_interval: 3
    # Harness：连续 N 轮工具调用后工作区指纹不变则退出（0=关闭；默认建议 3）
    no_progress_limit: 3
    # Harness：编码结束后、commit/PR 前执行的校验命令（空=跳过；失败则任务 failed）
    # verify_commands:
    #   - go test ./...
    # Harness：编码后用「全新上下文」LLM 对 git diff 做 PASS/FAIL（防自评；默认关闭）
    # independent_checker: true
    #   - "go test ./..."
    #   - "npm test"

  # 编码后端配置（Hub 后端）
  # 默认 builtin（内置 AgentLoop）；非写任务（analyze/review/reply）也可路由到 hub 后端
  # workspace_transport 仅接受 git_sync（缺省即 git_sync）：
  #   Matea 签发任务级 deploy key → Hub 持凭据自 clone/commit/push 草稿分支
  #   → Matea fetch 校验四要素后开 PR 并回收 key。详见 docs/HUB-BACKENDS.md
  #
  # 【旧 config.yaml 迁移示例】
  #   旧（A5 之前）:  workspace_transport: shared_path   → 直接删除该行（git_sync 为默认）
  #   旧（C1 之前）:  workspace_transport: mcp          → 直接删除该行（Phase 3.9 才回归）
  #   已废弃字段:     workspace_mode / allow_fallback_builtin —— A5 起失效，留着不报错但无作用，
  #                  建议删除（hub 写任务失败永不回退 builtin，避免信任模型被替换）。
  backends:
    default: builtin
    backends:
      builtin:
        type: builtin
      # opencode-local:
      #   type: hub-opencode
      #   base_url: "http://127.0.0.1:4096"
      #   auth:
      #     username: opencode
      #     password: "${OPENCODE_SERVER_PASSWORD}"
      #   timeout: "45m"
      #   workspace_transport: git_sync    # 唯一合法值；缺省同效
      #   # denied_paths: ["deploy/*"]     # B3：追加 diff deny（内置已含 .env*/密钥材料）
      #   # allowed_paths: ["src/*"]       # B3：进一步收敛（deny 仍绝对优先）
      #   health_check:
      #     path: /global/health
      #     interval: 30s
      # hermes-local:
      #   type: hub-hermes
      #   base_url: "http://127.0.0.1:9090"
      #   auth:
      #     password: "${HERMES_RUNS_TOKEN}"
      #   timeout: "45m"
      #   workspace_transport: git_sync

  templates:
    analyze:
      name: "需求分析 Agent"
      type: "analyze"
      system_prompt: |
        你是一个需求分析专家。你的任务是分析用户提交的 Issue，评估需求完整性和可行性。
        请输出结构化的需求分析报告，包括：
        1. 需求摘要
        2. 完整性评估（是否有遗漏）
        3. 可行性分析
        4. 建议的实现方案
        5. 风险点
      user_template: |
        请分析以下 Issue：

        ## Issue #{{.Issue.Number}}: {{.Issue.Title}}

        **状态**: {{.Issue.State}}
        **作者**: {{.Issue.User.Login}}

        {{.Issue.Body}}

        请输出结构化需求分析报告。

    review:
      name: "代码审查 Agent"
      type: "review"
      system_prompt: |
        你是一个资深代码审查专家。请审查 PR 变更，输出结构化审查报告。
        关注点：
        1. 代码质量和可读性
        2. 潜在的 bug 和安全问题
        3. 性能影响
        4. 测试覆盖
        5. 改进建议
      user_template: |
        请审查以下 PR：

        ## PR #{{.PR.Number}}: {{.PR.Title}}

        **状态**: {{.PR.State}}
        **作者**: {{.PR.User.Login}}
        **分支**: {{.PR.Head.Ref}} → {{.PR.Base.Ref}}

        {{.PR.Body}}

        请输出结构化审查报告。

    reply:
      name: "评论回复 Agent"
      type: "interaction"
      system_prompt: |
        你是一个友好的 AI 助手。请根据上下文回复用户的评论。
        保持专业、简洁、有帮助。
      user_template: |
        请回复以下评论：

        **评论者**: {{.Comment.User.Login}}
        **内容**:
        {{.Comment.Body}}

        请给出有帮助的回复。

# ===== 工作流配置 (v2 Assign 工作流) =====
# workflow:
#   # 预设: free | standard | strict
#   preset: standard
#   gates:
#     coder_requires_analyzed: off      # strict → hard
#     allow_skip_analyze: true
#     reanalyze_while_developing: soft
#     rerun_same_stage: soft
#     review_warn_if_draft: off
#     coder_switch_agent: soft
#   notify:
#     on_analyze_done: true
#     on_coder_pr_opened: true
#     on_gate_soft: true
#     on_gate_hard: true

# ===== Session 配置 (Phase 17) =====
# session:
#   idle_ttl: "168h"              # 7 天无活动则 archive
#   workspace_retention: "24h"    # archived 后延迟删盘
#   pr_closed_retention: "168h"   # PR 未合并关闭后保留
#   max_disk_per_repo: "5GB"      # 超限 LRU

# ===== 沙箱配置 (P1.6) =====
# 约定：task 级 workspace 为 {sandbox.base_dir}/task_{id}；Session 为 {workspace.base_dir}/sessions/...
# 若 sandbox.base_dir 留空或仍为历史默认 "./workspace"，启动时自动对齐为 workspace.base_dir。
# Session 工作区走 NewWithPath（Persistent）：不受 mode=temp 的 MkdirTemp/任务结束 Cleanup 影响，
# 回收由 SessionLifecycle（Issue closed / PR merged / idle TTL / 磁盘上限）负责。
sandbox:
  # 工作目录模式: "fixed" | "temp"（仅影响无 Session 的 task 级 workspace）
  # fixed: 使用固定 base_dir + task_{id} 子目录
  # temp: 使用临时目录 (os.MkdirTemp)，任务完成后 Cleanup（Session 路径永不走此路径）
  mode: "fixed"
  # 与 workspace.base_dir 同根，避免 Session / Sandbox 双轨分裂
  base_dir: "./data/work"
  # 单命令超时
  command_timeout: "5m"
  # 任务总超时
  task_timeout: "30m"
  # 命令输出最大字节数
  max_output: 1048576
  # 文件写入最大字节数
  max_file_size: 1048576
  # 失败任务保留时间（fixed 模式）
  cleanup_after: "24h"

# ===== MCP 服务器配置 (P2.8) =====
# 远程 MCP (Model Context Protocol) 服务器定义
# Agent 可通过 mcp_servers 字段启用指定服务器的工具
mcp:
  servers:
    # 示例：一个提供知识库检索的 MCP 服务器
    # knowledge-base:
    #   base_url: "http://localhost:8081/mcp"
    #   api_key: "${MCP_KB_API_KEY}"   # Bearer token；无鉴权可留空
    #   timeout: "30s"
    # 示例：文件系统 MCP
    # filesystem:
    #   base_url: "http://localhost:8082/mcp"
    #   timeout: "15s"

# ===== 出站扇出配置 (task 2.3.3) =====
# 把 Agent 完成事件（task_completed 等）以 JSON POST 到单个外部 webhook。
# 仅出站、无入站模块：Hermes Poll / OpenCode 同步均不向 Matea 推送完成事件，由 Matea 主动发。
# webhook_url 留空 = 关闭（结果只落 Gitea，不通知人类）。
#
# 各 backend 是否需要配 deliver：
#   builtin       — 可选（默认结果评论已写回 Gitea，IM 通知按需）
#   hub-opencode  — 必配（OpenCode 无自带 IM 渠道，是 2.2.4 的硬缺口）
#   hub-hermes    — 可不配（Hermes 自带飞书/企微原生渠道，结果经 Hermes 回传）
#
# webhook_url 指向建议（三选一）：
#   1) 自建 IM bridge：最常见，bridge 接收 Event 后转飞书/企微/钉钉机器人消息（见下方示例）
#   2) Hub 接收端：Hermes gateway 或自研中转，统一分发给多渠道
#   3) 直接对接机器人 webhook：若机器人接受任意 JSON 即可，但通常需 bridge 做格式转换
#
# Event payload（POST body，application/json）：
#   {
#     "event":     "task_completed",      // 事件类型
#     "channel":   "feishu",              // 渠道标识，由 bridge 解释
#     "thread_id": "issue_42",            // 可选，用于 IM 续接会话
#     "repo":      "owner/repo",          // 可选
#     "issue_id":  42,                    // 可选，0 表示无关联
#     "pr_id":     0,                     // 可选，0 表示无关联
#     "action":    "comment",             // comment | create_pr | none
#     "content":   "..."                  // 事件正文（评论内容 / PR 链接等）
#   }
#
# 自建 bridge 示例（最小骨架，把 Event 转成飞书机器人消息）：
#   # bridge 监听 :9090/event，把 content 转飞书 text 消息
#   from flask import Flask, request
#   import requests
#   app = Flask(__name__)
#   FEISHU_WEBHOOK = "https://open.feishu.cn/open-apis/bot/v2/hook/xxxxx"
#   @app.post("/event")
#   def event():
#       e = request.json
#       msg = {"msg_type": "text", "content": {"text": f"[{e['repo']}] {e['content']}"}}
#       r = requests.post(FEISHU_WEBHOOK, json=msg)
#       return ("", r.status_code)
#   # 然后把 matea 的 deliver.webhook_url 指向 http://localhost:9090/event
deliver:
  webhook_url: ""                       # 留空 = 关闭；OpenCode 必配，见 2.2.4
  # 单次 POST 超时；留空或非法 → 默认 10s
  timeout: "10s"
  # 首次失败后的额外重试次数（网络错误/5xx 才重试；4xx 不重试）；0 = 仅一次
  max_retries: 1
